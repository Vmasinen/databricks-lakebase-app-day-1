<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hint {
      color: #666;
      font-size: 14px;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      margin-top: 8px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      margin-top: 16px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    button:active {
      transform: translateY(0);
    }
    .delete-btn {
      padding: 6px 12px;
      margin: 0;
      background: #ff4757;
      font-size: 14px;
      box-shadow: none;
    }
    .delete-btn:hover {
      background: #ee2f3f;
      transform: none;
      box-shadow: none;
    }
    #result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      min-height: 20px;
      font-size: 14px;
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      color: #333;
    }
    .watchlist-section {
      margin-top: 40px;
    }
    .watchlist-header {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 16px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 12px;
      color: white;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    td {
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      color: #333;
    }
    tbody tr:hover {
      background: #f8f9ff;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    .price {
      font-weight: 600;
      color: #667eea;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

    <form id="stock-form">
      <label for="symbol">Ticker symbol</label>
      <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      <button type="submit">Add to watchlist</button>
    </form>

    <div id="result"></div>

    <div class="watchlist-section">
      <h2 class="watchlist-header">Your Watchlist</h2>
      <table id="watchlist-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Email</th>
            <th>Latest price</th>
            <th>Updated</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="watchlist-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        if (data.length === 0) {
          const tr = document.createElement("tr");
          tr.innerHTML = '<td colspan="5" class="empty-state">No stocks in your watchlist yet. Add one above!</td>';
          watchlistBody.appendChild(tr);
        } else {
          data.forEach((row) => {
            const tr = document.createElement("tr");
            const price = row.latest_price !== null && row.latest_price !== undefined
              ? Number(row.latest_price).toFixed(2)
              : "-";
            const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
            tr.innerHTML = `
              <td><strong>${row.symbol}</strong></td>
              <td>${row.email || "-"}</td>
              <td class="price">$${price}</td>
              <td>${updated}</td>
              <td><button class="delete-btn" onclick="deleteSymbol('${row.symbol}')">Delete</button></td>
            `;
            watchlistBody.appendChild(tr);
          });
        }
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    async function deleteSymbol(symbol) {
      if (!confirm(`Are you sure you want to remove ${symbol} from your watchlist?`)) {
        return;
      }
      
      resultEl.textContent = `Removing ${symbol}...`;
      
      try {
        const resp = await fetch(`/watchlist/${symbol}`, {
          method: "DELETE",
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = `Removed ${symbol} from watchlist`;
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    }

    loadWatchlist();
  </script>
</body>
</html>
